services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      CONVERSATION_STORE: redis
      REDIS_URL: redis://redis:6379/0

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:8-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5

    volumes:
      - redis_data:/data

    restart: unless-stopped

volumes:
  redis_data:
